name: Custard CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Linux GUI & FLTK Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libssl-dev \
          libx11-dev \
          libxext-dev \
          libxft-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxrender-dev \
          libxfixes-dev \
          libfontconfig1-dev

    - name: Run Tests
      run: cargo test